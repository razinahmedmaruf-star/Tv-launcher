name: Build Android TV Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          echo "Repository files:"
          ls -la
          find . -maxdepth 5 \( -name gradlew -o -name gradlew.bat \)

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./SmartTVLauncher/gradlew" ]; then
            cd SmartTVLauncher
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper not found."
            echo "The Android project structure must be checked."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-Launcher-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            SmartTVLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
